<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algerian Forest Fire Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 40px;
        }

        .container{
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button{
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Algerian Forest Fire Prediction</h1>

        <!-- Main Input For Receiving Query to our ML -->
        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <input type="text" name="Temperature" placeholder="Temperature" required /><br>

            <input type="text" name="RH" placeholder="RH" required /><br>

            <input type="text" name="Ws" placeholder="Ws" required /><br>

            <input type="text" name="Rain" placeholder="Rain" required /><br>

            <input type="text" name="FFMC" placeholder="FFMC" required /><br>

            <input type="text" name="DMC" placeholder="DMC" required /><br>

            <input type="text" name="ISI" placeholder="ISI" required /><br>

            <input type="text" name="Classes" placeholder="Classes" required /><br>

            <input type="text" name="Region" placeholder="Region" required /><br>

            <button type="submit">Predict</button>

        </form>

        <h2>
            THE FWI prediction is {{ results }}
        </h2>

    </div>

</body>
</html>
